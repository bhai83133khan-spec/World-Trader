name: Build Old World Trader APK

on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'
  push:
    branches: [ main, master, ai-kingdom-combat ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: old-world-trader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OldWorldTrader-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release signing secrets
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64" || { echo "::error::Missing ANDROID_SIGNING_KEY_BASE64 secret"; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_STORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_ALIAS" || { echo "::error::Missing ANDROID_SIGNING_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_KEY_PASSWORD secret"; exit 1; }
      - name: Decode release keystore
        run: |
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/oldworldtrader-release.jks"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/oldworldtrader-release.jks" >> "$GITHUB_ENV"
      - name: Run unit tests and assemble signed release APK
        run: gradle testDebugUnitTest assembleRelease
      - name: Verify signed APK and application package
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Release APK is missing or empty"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          test -n "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.oldworldtrader.game'"
      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OldWorldTrader-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "Old World Trader $GITHUB_REF_NAME" \
            --notes "Signed Android release. CI unit tests and APK signature/package verification completed."
