name: AutoForge Python CI
on:
  push:
    branches: [autoforge-phase1-backend]
    paths:
      - "autoforge/**"
      - ".github/workflows/autoforge-python-ci.yml"
  pull_request:
    paths:
      - "autoforge/**"
      - ".github/workflows/autoforge-python-ci.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
